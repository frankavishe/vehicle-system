name: frontend-ci

on:
  push:
    paths: ["web/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    # No apps/orders-style pytest rigor here yet — Phase 2's frontend has
    # no automated test suite, only lint + a production build (which
    # already catches every TypeScript/route/Server-Component error the
    # App Router can surface at build time). Not full parity with
    # backend-ci.yml by design; see phase.md.
    env:
      BACKEND_INTERNAL_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
