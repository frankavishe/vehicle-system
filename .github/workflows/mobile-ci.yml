name: mobile-ci

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    # Deliberately light, mirroring frontend-ci.yml's own asymmetry
    # applied to this second UI stack (see mobile/README.md's Testing
    # section / phase.md): `flutter analyze` + the pure-logic unit suite
    # (router redirect guard, client-side ALLOWED_TRANSITIONS mirror, dio's
    # 401-retry interceptor) + a debug APK build. No widget/golden/
    # integration suite, no real device/emulator.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
