services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoserve}
      POSTGRES_USER: ${POSTGRES_USER:-autoserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoserve}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoserve}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    # No host port mapping: only `backend`/future Celery workers talk to
    # this over the internal compose network (`redis:6379`); host-exposing
    # it isn't needed and risks colliding with other projects' Redis
    # containers on the default 6379 port (hit this locally, hence the
    # comment).
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Phase 4: swapped from `runserver` to daphne (Django Channels' own
    # ASGI server) — one process now serves both the existing DRF/HTTP
    # surface and the new WebSocket tracking consumer (config/asgi.py's
    # ProtocolTypeRouter), rather than running two separate servers.
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Phase 4: the previously-deferred periodic-task runner — currently
    # drives only the weekly provider payout batch (PLAN.md §5.5,
    # config/celery.py's CELERY_BEAT_SCHEDULE). A separate process/
    # container from celery_worker per Celery's own recommendation (beat
    # only schedules; worker executes).
    command: celery -A config beat -l info
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Phase 4: self-hosted routing engine for the RECOVERY fare engine
  # (PLAN.md §5.2) — Haversine is the fallback whenever this is
  # unreachable or has no route, so the app works before the one-time
  # data-prep step below is done. See infra/osrm/README.md for it; this
  # service alone (no volume prepared yet) will just sit unreachable,
  # which is the intended, harmless starting state.
  osrm:
    image: osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/tanzania-latest.osrm
    volumes:
      - ../infra/osrm/data:/data
    ports:
      - "5001:5000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    volumes:
      - ../web:/app
      # Anonymous volumes so the host's (Windows) node_modules/.next never
      # shadow the ones installed inside the Linux container image — same
      # reasoning as backend's bind mount, just two extra paths since
      # Node's build artifacts are OS-specific in a way Python's aren't.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ../web/.env
    environment:
      # Reaches `backend` over the compose network by service name — see
      # web/.env.example's comment on BACKEND_INTERNAL_URL.
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
