[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts = --reuse-db
# Phase 4: apps.tracking's WebsocketCommunicator tests are `async def` —
# auto mode lets them run without an explicit @pytest.mark.asyncio on each.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
